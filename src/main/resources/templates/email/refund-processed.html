<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Refund Processed</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 8px;">
        <h2 style="color: #16a085;">Refund Processed</h2>
        <p>Your refund of $<span th:text="${amount}">0.00</span> for payment ID <strong th:text="${paymentId}">PAY-123</strong> has been processed.</p>
        <p th:if="${reason != null}">Reason: <span th:text="${reason}">Reason</span></p>
    </div>
</body>
</html>
